# The game lives at https://wordbreak.games, served whole by the Render service (page
# and websocket from one origin). This repo's GitHub Pages site is what answers at
# https://benpastel.com/wordbreak/, the old address, so instead of the game it now
# publishes a redirect there (redirect/index.html), keeping old bookmarks and
# invite links working.

name: Redirect the old Pages address

on:
  push:
    branches: [main]
    paths: [redirect/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same page at the root, at the tutorial's old path, and as the 404 for
      # anything else, so every old URL forwards.
      - run: |
          mkdir site
          cp redirect/index.html site/index.html
          cp redirect/index.html site/tutorial.html
          cp redirect/index.html site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
