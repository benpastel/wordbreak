<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>WordBreak type shortlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville+SC:wght@400..700&family=Baskervville:ital,wght@0,400..700;1,400..700&family=Besley:ital,wght@0,400..900;1,400..900&family=Holtwood+One+SC&family=IM+Fell+Double+Pica+SC&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=IM+Fell+French+Canon+SC&family=IM+Fell+Great+Primer+SC&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Libre+Caslon+Text:wght@400;700&family=Libre+Franklin:wght@400..900&family=Ultra&display=swap">
<style>
/* Tokens copied from src/client/styles.css so every specimen is the real board,
   with only the type swapped. Each direction sets three registers:
     --T-*  TILE   letters, words, the wordmark, scores, the clock
     --L-*  LABEL  buttons, headings, names, settings, badges
     --P-*  PROSE  chat and definitions */
@property --p { syntax: '<percentage>'; inherits: false; initial-value: 0%; }

:root {
  --ground: oklch(0.94 0.008 85);
  --tray: oklch(0.902 0.012 85);
  --tile-face: oklch(0.985 0.004 85);
  --ink: oklch(0.22 0.01 60);
  --ink-soft: oklch(0.52 0.008 70);
  --ink-mute: oklch(0.7 0.008 70);
  --hairline: oklch(0.86 0.01 85);
  --selink: oklch(0.55 0.01 70);
  --shadow-1: 0 1px 1px oklch(0.3 0.02 70 / 0.1);
  --shadow-2: 0 2px 5px oklch(0.3 0.02 70 / 0.1);
  --r-ctl: 7px;
  --r-ctl-lg: 9px;
  --go: oklch(0.55 0.12 148);
  --sys: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-family: var(--sys);
  color-scheme: light;
}
.c0 { --hue: 250; --cf: 0.085; --lf: 0.87;  --ci: 0.16; }
.c1 { --hue: 25;  --cf: 0.105; --lf: 0.855; --ci: 0.165; }
.c2 { --hue: 148; --cf: 0.12;  --lf: 0.845; --ci: 0.14; }
.c0, .c1, .c2 {
  --pf: oklch(var(--lf) var(--cf) var(--hue));
  --pc: oklch(0.55 var(--ci) var(--hue));
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.page { width: min(1120px, 100%); margin: 0 auto; padding: 40px 24px 120px; }

/* ---------------------------------------------------------------- line-up */
.lineup { display: grid; grid-template-columns: max-content 1fr; gap: 10px 22px; align-items: center; }
.lineup a { color: var(--ink-soft); text-decoration: none; font-size: 0.72rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; }
.lineup a:hover { color: var(--ink); }
.lineup .strip { --cell: 42px; }
.strip { display: inline-flex; gap: calc(var(--cell) * 0.1); padding: calc(var(--cell) * 0.1);
  border-radius: 10px; background: var(--tray);
  box-shadow: inset 0 1px 3px oklch(0.3 0.02 70 / 0.13), inset 0 0 0 1px oklch(0.3 0.02 70 / 0.05); }
.strip .tile { width: var(--cell); }

/* --------------------------------------------------------------- direction */
.dir { padding-top: 64px; margin-top: 64px; border-top: 1px solid var(--hairline); }
.about { max-width: 68ch; margin-bottom: 28px; }
.about h2 {
  margin: 0; font-family: var(--T-font); font-weight: var(--T-w); font-variation-settings: var(--T-v);
  font-size: calc(1.9rem * var(--T-s)); letter-spacing: var(--T-t); text-transform: uppercase; line-height: 1.1;
}
.about .fonts { margin: 6px 0 12px; font-size: 0.8rem; color: var(--ink-soft); }
.about p { margin: 0 0 8px; font-size: 0.95rem; line-height: 1.55; }

.spec { display: grid; grid-template-columns: auto 1fr; gap: 36px 48px; align-items: start; }
@media (max-width: 860px) { .spec { grid-template-columns: 1fr; } }

/* -------------------------------------------------------------- the board */
.boardwrap { --n: 5; --cell: 56px; --gap: calc(var(--cell) * 0.1); }
.board {
  position: relative; display: grid; grid-template-columns: repeat(var(--n), var(--cell));
  gap: var(--gap); padding: var(--gap); border-radius: 14px; background: var(--tray); width: max-content;
  box-shadow: inset 0 1px 3px oklch(0.3 0.02 70 / 0.13), inset 0 0 0 1px oklch(0.3 0.02 70 / 0.05);
}
.trail { position: absolute; inset: var(--gap); pointer-events: none; overflow: visible; }
.trail polyline { fill: none; stroke-width: 0.05; stroke-linecap: round; stroke-linejoin: round; opacity: 0.4; }
.trail polyline.sel {
  stroke: var(--selink); stroke-width: 0.062; opacity: 0.75;
  stroke-dasharray: 0.17 0.13; animation: ants 1.1s linear infinite;
}
@keyframes ants { to { stroke-dashoffset: -0.6; } }

.tile {
  position: relative; aspect-ratio: 1; border-radius: 13%; display: grid; place-items: center;
  font-family: var(--T-font); font-weight: var(--T-w); font-variation-settings: var(--T-v);
  font-size: calc(var(--cell) * 0.46 * var(--T-s)); letter-spacing: 0;
  color: var(--ink); background: var(--tile-face);
  --ring: inset 0 0 0 0 transparent;
  box-shadow: var(--ring), var(--shadow-1), var(--shadow-2);
}
.tile > span {
  position: relative; z-index: 1; line-height: 1;
  text-box: trim-both cap alphabetic; translate: 0 var(--T-dy, 0);
}
.tile.claimed {
  --ring: inset 0 0 0 3px var(--pc);
  background:
    linear-gradient(to top, var(--pf) 0 var(--p), transparent calc(var(--p) + 1.5%) 100%),
    var(--tile-face);
}
.tile.sel::before {
  content: ''; position: absolute; z-index: 0; inset: 17%; border-radius: 50%;
  background: oklch(0.885 0.008 75);
  box-shadow: inset 0 1.5px 3px oklch(0.3 0.02 70 / 0.26), inset 0 -1px 0 oklch(1 0 0 / 0.7);
}

.readout { display: flex; align-items: center; justify-content: flex-end; gap: 14px; margin-top: 14px; }
.readout .word {
  font-family: var(--T-font); font-weight: var(--T-w); font-variation-settings: var(--T-v);
  font-size: calc(var(--cell) * 0.46 * var(--T-s)); letter-spacing: var(--T-t); line-height: 1;
}
.readout .claim {
  background: var(--ink); color: var(--ground); padding: 7px 15px;
  display: inline-flex; align-items: center; gap: 7px;
  font-size: calc(0.82rem * var(--L-s)); font-weight: var(--L-w2);
}
.readout .claim kbd { font: 700 0.82em var(--sys); padding: 1px 5px; border-radius: 4px;
  background: oklch(1 0 0 / 0.18); color: inherit; }
.readout .x {
  background: var(--tray); color: var(--ink-soft); width: 46px; height: 46px; border-radius: 50%;
  font-size: 1.35rem; font-weight: 700; line-height: 1; display: grid; place-items: center; padding: 0;
  font-family: var(--sys);
}

/* --------------------------------------------------------------- the rest */
.ui { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row.split { justify-content: space-between; }

.lbl, button, .tname, .meta, .phase, .badge, .setting label, .name, .chatline b, .h3 {
  font-family: var(--L-font); font-weight: var(--L-w); font-variation-settings: var(--L-v);
  letter-spacing: var(--L-t); text-transform: var(--L-tt); font-style: var(--L-i);
  font-variant-numeric: lining-nums;
}
.tilefont, .pts, .clock, .claims li, .wordmark, .recappts {
  font-family: var(--T-font); font-weight: var(--T-w); font-variation-settings: var(--T-v);
  font-variant-numeric: var(--N);
}

.wordmark { font-size: calc(1.5rem * var(--T-s)); margin: 0; text-transform: uppercase;
  letter-spacing: var(--T-t); line-height: 1.15; }
.tag { margin: 6px 0 0; font-size: calc(0.74rem * var(--L-s)); }
.tag a { color: var(--ink-soft); text-underline-offset: 2px; }

.h3 { font-size: calc(0.72rem * var(--L-s)); color: var(--ink-soft); margin: 0; }

button { border: 0; border-radius: var(--r-ctl); cursor: pointer; }
.primary {
  background: var(--ink); color: var(--ground); font-weight: var(--L-w2);
  padding: 9px 20px; font-size: calc(0.9rem * var(--L-s));
  box-shadow: var(--shadow-1), var(--shadow-2);
}
.primary.big { padding: 13px 28px; font-size: calc(1rem * var(--L-s)); border-radius: var(--r-ctl-lg); }
.primary.on { background: var(--go); }
.primary.filling {
  --p: 46%; color: var(--ink);
  background:
    linear-gradient(to top, var(--pf) 0 var(--p), transparent calc(var(--p) + 1.5%) 100%),
    var(--tile-face);
  box-shadow: inset 0 0 0 3px var(--pc), var(--shadow-1), var(--shadow-2);
}
.ghost {
  background: var(--tile-face); color: var(--ink-soft);
  padding: 8px 16px; font-size: calc(0.85rem * var(--L-s));
  box-shadow: var(--shadow-1), var(--shadow-2);
}
.ghost.big { padding: 13px 28px; font-size: calc(1rem * var(--L-s)); border-radius: var(--r-ctl-lg); }

.setting { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.setting label { font-size: calc(0.72rem * var(--L-s)); color: var(--ink-soft); width: 82px; }
.segmented { display: flex; gap: 6px; }
.segmented button {
  background: var(--tile-face); color: var(--ink-soft);
  font-size: calc(0.82rem * var(--L-s)); padding: 6px 13px;
  box-shadow: var(--shadow-1), var(--shadow-2);
}
.segmented button.on { background: var(--ink); color: var(--ground); box-shadow: none; }

.tablerow {
  display: flex; align-items: center; gap: 14px;
  background: var(--tile-face); border-radius: 12px; padding: 13px 18px;
  box-shadow: var(--shadow-1), var(--shadow-2);
}
.tname { flex: 1; font-size: calc(1rem * var(--L-s)); }
.dots { display: flex; gap: 4px; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: var(--pc); display: inline-block; }
.meta { font-size: calc(0.78rem * var(--L-s)); color: var(--ink-soft); font-weight: inherit; font-variant-numeric: tabular-nums; }
.phase {
  font-size: calc(0.66rem * var(--L-s)); padding: 3px 9px; border-radius: 999px;
  background: var(--ink); color: var(--ground);
}
.badge {
  font-size: calc(0.64rem * var(--L-s)); padding: 3px 8px; border-radius: var(--r-ctl);
  background: var(--tile-face); color: var(--ink-soft); box-shadow: var(--shadow-1), var(--shadow-2);
}

.scores { display: flex; gap: 16px 30px; flex-wrap: wrap; align-items: flex-start; }
.player { display: flex; flex-direction: column; gap: 5px; }
.playerhead { display: flex; align-items: baseline; gap: 8px; }
.player .name { color: var(--pc); font-size: calc(1rem * var(--L-s)); }
.player .pts { font-size: calc(1.2rem * var(--T-s)); color: var(--pc); }
.claims { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.claims li { font-size: calc(0.78rem * var(--T-s)); line-height: 1.35; text-transform: uppercase; letter-spacing: var(--T-t); color: var(--pc); }

.clock { font-size: calc(0.9rem * var(--T-s)); color: var(--ink-mute); letter-spacing: var(--T-t); }
.clock.low { color: oklch(0.58 0.17 28); }

.recapwho { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.recapwho .name { color: var(--pc); font-size: calc(1.4rem * var(--L-s)); }
.recappts { color: var(--pc); font-size: calc(3.4rem * var(--T-s)); line-height: 1.05; }

.chatline {
  margin: 0; font-family: var(--P-font); font-size: calc(0.86rem * var(--P-s)); line-height: 1.45;
}
.chatline b { color: var(--pc); margin-right: 8px; font-size: calc(0.86rem * var(--L-s) / var(--P-s)); }
.deftip {
  max-width: 300px; background: var(--ink); color: var(--ground); border-radius: var(--r-ctl);
  padding: 8px 12px; font-family: var(--P-font); font-size: calc(0.8rem * var(--P-s)); line-height: 1.4;
}
.deftip b {
  font-family: var(--T-font); font-weight: var(--T-w); font-variation-settings: var(--T-v);
  letter-spacing: var(--T-t); margin-right: 6px; text-transform: uppercase;
}
.recapword {
  position: relative; font-family: var(--T-font); font-weight: var(--T-w); font-variation-settings: var(--T-v);
  font-size: calc(0.86rem * var(--T-s)); letter-spacing: var(--T-t); text-transform: uppercase; color: var(--pc);
}
.recapword i { position: absolute; left: -2px; right: -2px; top: calc(50% - 1px); height: 2px; border-radius: 1px; background: var(--pc); }

.panel { display: flex; gap: 40px; align-items: flex-end; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* Ink: a stroke to fatten the letter like over-inking, a warm ink, and a highlight
   under it so the letter reads as bitten into the tile. All default to nothing. */
.tile > span, .readout .word, .wordmark, .pts, .recappts, .claims li, .recapword, .clock, .about h2, .abc .tile > span {
  -webkit-text-stroke: var(--T-stroke) currentColor;
}
.tile > span, .readout .word, .wordmark, .about h2 { text-shadow: var(--T-shadow); }
.tile, .readout .word, .wordmark { color: var(--T-ink); }

.chapter { margin-top: 110px; padding-top: 0; }
.chapter > h1 {
  margin: 0 0 12px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-soft);
  padding-bottom: 10px; border-bottom: 2px solid var(--ink);
}
.chapter > p { max-width: 68ch; font-size: 0.95rem; line-height: 1.55; margin: 0 0 8px; }
.chapter .dir:first-of-type { border-top: 0; margin-top: 24px; }

.abc { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 30px; --cell: 37px; }
.abc .tile { width: var(--cell); font-size: calc(var(--cell) * 0.5 * var(--T-s)); }
.digits { display: flex; gap: 22px; align-items: baseline; margin: -14px 0 32px; color: var(--ink-soft); }
.digits span { font-family: var(--T-font); font-weight: var(--T-w); font-variation-settings: var(--T-v);
  font-size: calc(1.6rem * var(--T-s)); letter-spacing: 0.04em; color: var(--ink); }
.digits .os { font-variant-numeric: oldstyle-nums; }
.lineup .grp { grid-column: 1 / -1; margin-top: 14px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink); }
.lineup .grp:first-child { margin-top: 0; }
.mac { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: oklch(0.55 0.13 45); margin-left: 8px; }
</style>
</head>
<body>
<div class="page">
  <div class="lineup" id="lineup"></div>
  <div id="dirs"></div>
</div>

<script>
/* T tile, L label, P prose. f font, w weight (w2 primary buttons), t tracking,
   s size scale, v variation settings. Tile extras: stroke, shadow, ink. Label
   extras: i (italic), tt (text-transform; 'none' lets a small-caps font show its
   small caps). N: numerals on scores and the clock. mac: renders only on a Mac. */
const INKED = { stroke: '0.04em', ink: 'oklch(0.26 0.025 50)', shadow: '0 1px 0 oklch(1 0 0 / 0.75)' };

const CH = [
  {
    id: 'fell', name: 'Antique Letterpress',
    intro: [
      `The Fell types were bought in Holland for Oxford University Press by Bishop John Fell in the 1670s. Igino Marini digitised them from printed specimens and kept the ink spread and wobble. Each size was cut separately by hand, so the sizes differ more than weights of one font would.`,
      `None of them has a bold, and that's the main problem for tiles, so a couple of the variants below cheat. They also only have old-style numerals, the kind that rise and fall like lowercase letters, so scores bounce.`,
    ],
    V: [
      {
        id: 'fell-english', name: 'English', fonts: 'IM Fell English SC · IM Fell English prose',
        idea: [`The one from last time. A text size: light and even, with a gentle wobble.`],
        T: { f: "'IM Fell English SC', serif", w: 400, t: '0.04em', s: 1.12 },
        L: { f: "'IM Fell English SC', serif", w: 400, t: '0.08em', s: 1.12 },
        P: { f: "'IM Fell English', serif", s: 1.08 },
      },
      {
        id: 'fell-greatprimer', name: 'Great Primer', fonts: 'IM Fell Great Primer SC',
        idea: [`A larger cut with sharper serifs and more contrast. This is the most elegant Fell, and you can see the Dutch faces Caslon later learned from.`],
        T: { f: "'IM Fell Great Primer SC', serif", w: 400, t: '0.04em', s: 1.08 },
        L: { f: "'IM Fell Great Primer SC', serif", w: 400, t: '0.08em', s: 1.08 },
        P: { f: "'IM Fell English', serif", s: 1.08 },
      },
      {
        id: 'fell-doublepica', name: 'Double Pica', fonts: 'IM Fell Double Pica SC',
        idea: [`Bigger again. The strokes are blacker and the ink squash is chunkier. It's the closest thing the family has to a bold, and the tiles start to hold their own against the coloured rings.`],
        T: { f: "'IM Fell Double Pica SC', serif", w: 400, t: '0.04em', s: 1.1 },
        L: { f: "'IM Fell Double Pica SC', serif", w: 400, t: '0.08em', s: 1.08 },
        P: { f: "'IM Fell English', serif", s: 1.08 },
      },
      {
        id: 'fell-canon', name: 'French Canon', fonts: 'IM Fell French Canon SC',
        idea: [`The display size, cut to be read from across a room. It's the heaviest and roundest of the set, with the most visible irregularity at tile size: an O that isn't quite round, a slightly drunk R.`],
        T: { f: "'IM Fell French Canon SC', serif", w: 400, t: '0.04em', s: 1.08 },
        L: { f: "'IM Fell French Canon SC', serif", w: 400, t: '0.08em', s: 1.06 },
        P: { f: "'IM Fell English', serif", s: 1.08 },
      },
      {
        id: 'fell-inked', name: 'French Canon, Inked', fonts: 'IM Fell French Canon SC · stroke 0.04em · warm ink · impression highlight',
        idea: [
          `Faking the press. A hairline stroke fattens each letter the way over-inking does, the ink is a warm brown-black, and a one-pixel highlight under each letter makes it look bitten into the tile rather than printed on top.`,
          `Only the tile register is inked. Labels stay clean.`,
        ],
        T: { f: "'IM Fell French Canon SC', serif", w: 400, t: '0.04em', s: 1.08, ...INKED },
        L: { f: "'IM Fell French Canon SC', serif", w: 400, t: '0.08em', s: 1.06 },
        P: { f: "'IM Fell English', serif", s: 1.08 },
      },
      {
        id: 'fell-smallcaps', name: 'Inked, Small-Cap Labels', fonts: 'French Canon tiles, inked · IM Fell English SC labels, true small caps',
        idea: [`Labels set as true small caps, the way a seventeenth-century printer set a running head. The app writes every label in lowercase, so they all come out as small caps: shorter and quieter than the tiles, which become the only full capitals on screen.`],
        T: { f: "'IM Fell French Canon SC', serif", w: 400, t: '0.04em', s: 1.08, ...INKED },
        L: { f: "'IM Fell English SC', serif", w: 400, t: '0.08em', s: 1.45, tt: 'none' },
        P: { f: "'IM Fell English', serif", s: 1.08 },
      },
      {
        id: 'fell-caslon', name: 'Fell Tiles, Caslon Labels', fonts: 'IM Fell Double Pica SC tiles · Libre Caslon Text 700 labels · IM Fell English prose',
        idea: [`Rough where it's big, clean where it's small. The Fell texture holds up at tile size but gets mushy in 11px labels. Caslon is a direct descendant of these Dutch types, so the two sit together comfortably.`],
        T: { f: "'IM Fell Double Pica SC', serif", w: 400, t: '0.04em', s: 1.1 },
        L: { f: "'Libre Caslon Text', serif", w: 700, t: '0.1em', s: 0.94 },
        P: { f: "'IM Fell English', serif", s: 1.08 },
      },
    ],
  },
  {
    id: 'bask', name: 'Baskerville',
    intro: [
      `John Baskerville, Birmingham, 1757. He also reworked the ink and pioneered smooth "wove" paper, which is why his type could carry finer hairlines than Caslon's. There are two free revivals and they're noticeably different, so both are here, plus your Mac's own Baskerville as a yardstick.`,
    ],
    V: [
      {
        id: 'bask-libre', name: 'Libre Baskerville', fonts: 'Libre Baskerville 700 · 400 prose',
        idea: [`The one from last time. Drawn for screens: wide, large and sturdy, with slightly softened hairlines. It's the most robust on a phone.`],
        T: { f: "'Libre Baskerville', serif", w: 700, t: '0.04em', s: 0.94 },
        L: { f: "'Libre Baskerville', serif", w: 700, t: '0.09em', s: 0.92 },
        P: { f: "'Libre Baskerville', serif", s: 0.92 },
      },
      {
        id: 'bask-anrt', name: 'Baskervville', fonts: 'Baskervville 700 · 400 prose',
        idea: [`ANRT's revival (the French national type workshop), drawn much closer to the 1757 originals. It's narrower and sharper with more contrast, and feels like a printed book rather than a web font. It also has a matching small-caps family, used below.`],
        T: { f: "'Baskervville', serif", w: 700, t: '0.04em', s: 1.0 },
        L: { f: "'Baskervville', serif", w: 700, t: '0.09em', s: 1.0 },
        P: { f: "'Baskervville', serif", s: 1.02 },
      },
      {
        id: 'bask-mac', name: 'Monotype Baskerville', mac: true, fonts: 'Baskerville Bold, as installed on macOS',
        idea: [`The Baskerville most people picture, and the one that comes with your Mac. It can't ship on the web without a licence, so it's here only as a yardstick for the two free ones. On another computer it falls back to a generic serif.`],
        T: { f: "'Baskerville', serif", w: 700, t: '0.04em', s: 1.0 },
        L: { f: "'Baskerville', serif", w: 600, t: '0.09em', s: 1.0 },
        P: { f: "'Baskerville', serif", s: 1.04 },
      },
      {
        id: 'bask-sc', name: 'Small-Cap Labels', fonts: 'Baskervville 700 tiles · Baskervville SC 600 labels',

function vars(d) {
  const T = d.T, L = d.L;
  return [
    `--T-font:${T.f}`, `--T-w:${T.w}`, `--T-t:${T.t}`, `--T-s:${T.s}`, `--T-v:${T.v ?? 'normal'}`,
    `--T-stroke:${T.stroke ?? '0px'}`, `--T-shadow:${T.shadow ?? 'none'}`, `--T-ink:${T.ink ?? 'var(--ink)'}`,
    `--L-font:${L.f}`, `--L-w:${L.w}`, `--L-w2:${L.w2 ?? L.w}`, `--L-t:${L.t}`, `--L-s:${L.s}`,
    `--L-v:${L.v ?? 'normal'}`, `--L-i:${L.i ?? 'normal'}`, `--L-tt:${L.tt ?? 'uppercase'}`,
    `--P-font:${d.P.f}`, `--P-s:${d.P.s}`, `--N:${d.N ?? 'lining-nums tabular-nums'}`,
  ].join(';');
}

const ABC = 'ABCDEFGHIJKLMNOPRSTUVWXYZ';
const abc = () => `<div class="abc">${[...ABC].map((l) => `<div class="tile"><span>${l}</span></div>`).join('')}</div>
  <div class="digits"><span>0123456789</span></div>`;
const LETTERS = 'STRAPEINOLCAWEDORTHMBULKS';
const CLAIMS = [
  { c: 0, idx: [0, 1, 2, 3, 4], p: 62 },   // STRAP
  { c: 1, idx: [12, 13, 14], p: 24 },      // WED
  { c: 2, idx: [20, 21, 22, 23], p: 86 },  // BULK
];
const SEL = [10, 15, 11, 17];              // COAT
const ctr = (i) => `${(i % 5) * 1.1 + 0.5},${Math.floor(i / 5) * 1.1 + 0.5}`;

function board() {
  const owner = {};
  CLAIMS.forEach((k) => k.idx.forEach((i) => (owner[i] = k)));
  const tiles = [...LETTERS].map((l, i) => {
    const k = owner[i];
    const cls = ['tile', k && `claimed c${k.c}`, SEL.includes(i) && 'sel'].filter(Boolean).join(' ');
    return `<div class="${cls}"${k ? ` style="--p:${k.p}%"` : ''}><span>${l}</span></div>`;
  }).join('');
  const lines = CLAIMS.map((k) =>
    `<polyline class="c${k.c}" stroke="var(--pc)" points="${k.idx.map(ctr).join(' ')}"/>`).join('');
  return `
    <div class="boardwrap">
      <div class="board">
        <svg class="trail" viewBox="0 0 5.4 5.4">${lines}<polyline class="sel" points="${SEL.map(ctr).join(' ')}"/></svg>
        ${tiles}
      </div>
      <div class="readout">
        <span class="word">COAT</span>
        <button class="claim">claim <kbd>⏎</kbd></button>
        <button class="x">✕</button>
      </div>
    </div>`;
}

function strip(word, claimFrom) {
  return `<div class="strip">${[...word].map((l, i) =>
    i >= claimFrom
      ? `<div class="tile claimed c0" style="--p:55%"><span>${l}</span></div>`
      : `<div class="tile"><span>${l}</span></div>`).join('')}</div>`;
}

document.getElementById('lineup').innerHTML = CH.map((c) =>
  `<div class="grp">${c.name}</div>` + c.V.map((d) => `
  <a href="#${d.id}">${d.name}</a>
  <div style="${vars(d)}">${strip('WORDBREAK', 4)}</div>`).join('')).join('');

document.getElementById('dirs').innerHTML = CH.map((c) => `
  <section class="chapter" id="${c.id}">
    <h1>${c.name}</h1>
    ${c.intro.map((p) => `<p>${p}</p>`).join('')}
    ${c.V.map((d) => `
    <section class="dir" id="${d.id}" style="${vars(d)}">
      <div class="about">
        <h2>${d.name}${d.mac ? '<span class="mac">mac only</span>' : ''}</h2>
        <div class="fonts">${d.fonts}</div>
        ${d.idea.map((p) => `<p>${p}</p>`).join('')}
      </div>
      ${abc()}
      <div class="spec">${board()}${ui()}</div>
    </section>`).join('')}
  </section>`).join('');
</script>
