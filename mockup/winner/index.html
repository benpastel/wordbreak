<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Winner Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&display=swap" rel="stylesheet" />
<style>
  :root {
    --ground: oklch(0.94 0.008 85);
    --tray: oklch(0.902 0.012 85);
    --tile-face: oklch(0.985 0.004 85);
    --ink: oklch(0.22 0.01 60);
    --ink-soft: oklch(0.52 0.008 70);
    --ink-mute: oklch(0.7 0.008 70);
    --hairline: oklch(0.86 0.01 85);
    --shadow-1: 0 1px 1px oklch(0.3 0.02 70 / 0.1);
    --gold: oklch(0.8 0.14 85);
    --gold-deep: oklch(0.62 0.13 75);
    --silver: oklch(0.82 0.01 250);
    --silver-deep: oklch(0.6 0.015 250);
    --bronze: oklch(0.7 0.1 55);
    --bronze-deep: oklch(0.55 0.1 50);
    --font: 'Archivo', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); }
  header.top { padding: 28px 24px 8px; max-width: 1400px; margin: 0 auto; }
  header.top h1 { margin: 0 0 6px; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 0.08em; }
  header.top p { margin: 0; color: var(--ink-soft); max-width: 760px; line-height: 1.45; }
  section { max-width: 1400px; margin: 0 auto; padding: 28px 24px; border-top: 1px solid var(--hairline); }
  section h2 { margin: 0 0 4px; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.08em; }
  section h2 i { font-style: normal; color: var(--ink-mute); margin-right: 10px; }
  section > p { margin: 0 0 18px; color: var(--ink-soft); max-width: 760px; line-height: 1.45; }
  .frames { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
  .frame { background: var(--tile-face); border-radius: 14px; box-shadow: 0 2px 10px oklch(0.3 0.02 70 / 0.12); overflow: hidden; }
  .frame.phone { width: 390px; }
  .frame.wide { width: 860px; max-width: 100%; }
  .frame .cap { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-mute); padding: 8px 12px 0; }
  .screen { padding: 14px 14px 22px; }

  /* the wall, simplified from styles.css */
  .shelf { display: grid; grid-template-rows: 1fr auto; grid-auto-flow: column; grid-auto-columns: calc(100% / var(--n)); }
  .stand { grid-row: span 2; display: grid; grid-template-rows: subgrid; min-width: 0; position: relative; }
  .tower { padding: 0 5px; container-type: inline-size; display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; }
  .row { position: relative; display: flex; gap: 2px; }
  .wt {
    --s: min(18px, calc(100cqi / var(--len) - 2px));
    width: var(--s); height: var(--s); border-radius: 13%; display: grid; place-items: center;
    font-weight: 800; font-size: calc(var(--s) * 0.56); text-transform: uppercase;
    background: color-mix(in oklab, var(--pf) 70%, var(--tile-face)); box-shadow: var(--shadow-1);
  }
  .row.broken .wt { background: none; box-shadow: inset 0 0 0 1px var(--hairline); color: var(--ink-mute); }
  .row .strike { position: absolute; left: -3px; right: -3px; top: calc(50% - 1px); height: 2px; border-radius: 1px; background: var(--sc); }
  .plinth {
    margin-top: 8px; padding: 6px 6px 0; border-top: 2px solid var(--ink);
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px;
    container-type: inline-size; min-width: 0;
  }
  .plinth .pts { font-weight: 800; font-size: clamp(1.8rem, 30cqi, 3.8rem); line-height: 1.05; color: var(--pc); font-variant-numeric: tabular-nums; }
  .plinth .name { font-weight: 650; font-size: clamp(0.72rem, 11cqi, 1.6rem); line-height: 1.15; color: var(--pc); overflow-wrap: anywhere; text-transform: uppercase; letter-spacing: 0.06em; }
  .coin { width: 22px; height: 22px; border-radius: 50%; margin-top: 4px; background: radial-gradient(circle at 35% 30%, #fff8 0 20%, transparent 45%), var(--mc); box-shadow: inset 0 0 0 2px var(--md); }
  .gold { --mc: var(--gold); --md: var(--gold-deep); }
  .silver { --mc: var(--silver); --md: var(--silver-deep); }
  .bronze { --mc: var(--bronze); --md: var(--bronze-deep); }

  /* 1: podium */
  .o1 .shelf { grid-template-rows: 1fr auto; }
  .o1 .plinth { border-top: none; margin-top: 8px; padding: 8px 6px 10px; background: var(--tray); border-radius: 6px 6px 0 0; }
  .o1 .stand[data-rank='1'] .plinth { padding-top: 40px; background: color-mix(in oklab, var(--gold) 35%, var(--tray)); }
  .o1 .stand[data-rank='2'] .plinth { padding-top: 24px; background: color-mix(in oklab, var(--silver) 40%, var(--tray)); }
  .o1 .stand[data-rank='3'] .plinth { padding-top: 12px; background: color-mix(in oklab, var(--bronze) 30%, var(--tray)); }
  .o1 .stand + .stand .plinth { margin-left: 2px; }
  .o1 .shelf { align-items: end; }
  .o1 .stand { display: flex; flex-direction: column; justify-content: flex-end; align-self: end; }
  .o1 .place { font-weight: 800; font-size: clamp(0.8rem, 12cqi, 1.3rem); color: var(--ink-soft); }

  /* 2: ordinals */
  .o2 .place { font-weight: 800; font-size: clamp(0.72rem, 11cqi, 1.2rem); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-mute); margin-bottom: 2px; }
  .o2 .stand[data-rank='1'] .place { color: var(--gold-deep); }
  .o2 .stand[data-rank='1'] .place::before { content: '★ '; }

  /* 3: headline */
  .headline { text-align: center; margin: 4px 0 22px; }
  .headline .who { font-weight: 800; font-size: clamp(1.8rem, 5vw, 3rem); text-transform: uppercase; letter-spacing: 0.04em; color: var(--pc); line-height: 1; }
  .headline .wins { display: block; margin-top: 6px; font-size: 0.8rem; font-weight: 650; text-transform: uppercase; letter-spacing: 0.2em; color: var(--ink-soft); }

  /* 4: spotlight */
  .o4 .stand[data-rank='1'] { background: linear-gradient(to top, color-mix(in oklab, var(--pf) 45%, transparent), transparent 85%); border-radius: 10px 10px 0 0; }
  .o4 .stand[data-rank='1'] .plinth { border-top-width: 3px; }
  .crown { display: block; margin: 0 auto 6px; width: clamp(26px, 30%, 44px); color: var(--gold-deep); }
  .o4 .stand:not([data-rank='1']) .pts, .o4 .stand:not([data-rank='1']) .name { opacity: 0.75; }

  /* 5: medal plinths */
  .o5 .plinth { border-top: 5px solid var(--hairline); }
  .o5 .stand[data-rank='1'] .plinth { border-top: 8px solid var(--gold); }
  .o5 .stand[data-rank='2'] .plinth { border-top-color: var(--silver); }
  .o5 .stand[data-rank='3'] .plinth { border-top-color: var(--bronze); }
  .o5 .ptsrow { display: flex; align-items: center; gap: 6px; justify-content: center; }
  .o5 .coin { margin: 0; width: clamp(20px, 22cqi, 34px); height: clamp(20px, 22cqi, 34px); flex: none; }
  .o5 .stand[data-rank='1'] .coin { width: clamp(26px, 30cqi, 46px); height: clamp(26px, 30cqi, 46px); }

  /* 6: scaled by place */
  .o6 .stand[data-rank='1'] .pts { font-size: clamp(2.6rem, 44cqi, 5.4rem); }
  .o6 .stand[data-rank='1'] .name { font-size: clamp(0.9rem, 14cqi, 1.9rem); }
  .o6 .stand[data-rank='2'] .pts { font-size: clamp(1.6rem, 27cqi, 3.2rem); }
  .o6 .stand[data-rank='3'] .pts { font-size: clamp(1.4rem, 23cqi, 2.8rem); }
  .o6 .stand[data-rank='4'] .pts { font-size: clamp(1.2rem, 19cqi, 2.4rem); }
  .o6 .stand:not([data-rank='1']) { opacity: 0.6; }
  .o6 .stand:not([data-rank='1']) .wt { filter: saturate(0.5); }

  /* 7: the winner's tower */
  .o7 .stand[data-rank='1'] .wt { background: color-mix(in oklab, var(--pf) 100%, var(--tile-face)); box-shadow: 0 0 0 1px var(--gold), 0 0 10px color-mix(in oklab, var(--gold) 60%, transparent); }
  .o7 .stand[data-rank='1'] .tower::after {
    content: ''; order: -1; display: none;
  }
  .o7 .flag { align-self: center; margin-bottom: 4px; padding: 3px 10px; border-radius: 999px; background: var(--gold); color: oklch(0.3 0.06 75); font-size: clamp(0.6rem, 9cqi, 0.8rem); font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; }
</style>
</head>
<body>
<header class="top">
  <h1>The winner, after a match</h1>
  <p>
    The same match throughout: maya won, you (benji) came second, the expert bot third, sam last.
    0 is today's layout. Each option stands alone; most could also be combined, say 3 with 5.
  </p>
</header>
<main id="main"></main>

<script>
const PLAYERS = [
  { name: 'maya', hue: 25, score: 35, medal: 'gold', words: [['lantern'], ['tens'], ['rope', 'x'], ['oars'], ['planet'], ['ten']] },
  { name: 'benji', hue: 250, score: 30, medal: 'silver', words: [['tops'], ['opera', 'x'], ['canter'], ['rat'], ['spine'], ['lip']] },
  { name: 'John Keats', hue: 145, score: 22, medal: 'bronze', words: [['dendron'], ['toot', 'x'], ['ore'], ['pan']] },
  { name: 'sam', hue: 75, score: 10, words: [['era', 'x'], ['cat'], ['top'], ['sip', 'x']] },
];
const pc = (p) => `oklch(0.52 0.13 ${p.hue})`;
const pf = (p) => `oklch(0.82 0.09 ${p.hue})`;
const ORD = ['1st', '2nd', '3rd', '4th'];
const CROWN = `<svg class="crown" viewBox="0 0 40 26"><path d="M3 24 L1 6 L11 14 L20 2 L29 14 L39 6 L37 24 Z" fill="currentColor"/></svg>`;

function tower(p, i) {
  return p.words.map(([w, broken]) => {
    const breaker = PLAYERS[(i + 1) % PLAYERS.length];
    return `<div class="row${broken ? ' broken' : ''}" style="--len:7">${[...w].map((c) => `<div class="wt"><span>${c}</span></div>`).join('')}${broken ? `<i class="strike" style="--sc:${pc(breaker)}"></i>` : ''}</div>`;
  }).join('');
}

/** `order` puts the stands in another order (the podium); hooks add to each part. */
function wall({ order = PLAYERS, top = () => '', pts = (p) => `<div class="pts">${p.score}</div>`, before = () => '', coin = true } = {}) {
  return `<div class="shelf" style="--n:${order.length}">${order.map((p) => {
    const i = PLAYERS.indexOf(p);
    return `
    <div class="stand" data-rank="${i + 1}" style="--pc:${pc(p)};--pf:${pf(p)}">
      <div class="tower">${tower(p, i)}${top(p, i)}</div>
      <div class="plinth">
        ${before(p, i)}
        ${pts(p, i)}
        <div class="name">${p.name}</div>
        ${coin && p.medal ? `<div class="coin ${p.medal}"></div>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

const OPTIONS = [
  {
    name: 'Today',
    blurb: 'For comparison: leaders first, all plinths alike, a medal coin under the top three names.',
    cls: 'o0',
    render: () => wall(),
  },
  {
    name: 'A podium',
    blurb: 'The plinths become steps: first tallest and gold, then silver and bronze, everyone else at floor level. Winner in the middle, as on a real podium, so the order reads 2 · 1 · 3 · 4.',
    cls: 'o1',
    render: () => wall({
      order: [PLAYERS[1], PLAYERS[0], PLAYERS[2], PLAYERS[3]],
      before: (p, i) => `<div class="place">${i + 1}</div>`,
      coin: false,
    }),
  },
  {
    name: 'Places above the scores',
    blurb: '1st, 2nd, 3rd above each score, small and quiet, with the winner\'s in gold and starred. The least change from today.',
    cls: 'o2',
    render: () => wall({ before: (p, i) => `<div class="place">${ORD[i]}</div>`, coin: false }),
  },
  {
    name: 'A headline',
    blurb: 'The winner\'s name, big and in their colour, across the top: the first thing you read. Ties would read "maya and benji".',
    cls: 'o3',
    render: () => `<div class="headline" style="--pc:${pc(PLAYERS[0])}"><span class="who">${PLAYERS[0].name}</span><span class="wins">wins</span></div>` + wall(),
  },
  {
    name: 'A spotlight and a crown',
    blurb: 'The winner\'s column lit in their colour from the plinth up, a crown on top of their tower, everyone else a little quieter.',
    cls: 'o4',
    render: () => wall({ top: (p, i) => (i === 0 ? CROWN : '') }),
  },
  {
    name: 'Medal plinths',
    blurb: 'The plinth line itself is the medal: a thick gold bar under the winner, silver and bronze under the next two, grey for the rest, and the coin beside the score rather than under the name.',
    cls: 'o5',
    render: () => wall({
      pts: (p) => `<div class="ptsrow">${p.medal ? `<div class="coin ${p.medal}"></div>` : ''}<div class="pts">${p.score}</div></div>`,
      coin: false,
    }),
  },
  {
    name: 'Scaled by place',
    blurb: 'The winner\'s score and name grow, every other stand shrinks and fades a little in order, so the eye lands on first place.',
    cls: 'o6',
    render: () => wall(),
  },
  {
    name: 'The winner\'s tower glows',
    blurb: 'The winning tower\'s tiles get a gold edge and glow, with a small "winner" tag on top. The words they won with carry the win.',
    cls: 'o7',
    render: () => wall({ top: (p, i) => (i === 0 ? `<div class="flag">winner</div>` : '') }),
  },
];

const main = document.getElementById('main');
OPTIONS.forEach((o, k) => {
  const s = document.createElement('section');
  s.innerHTML = `<h2><i>${k}</i>${o.name}</h2><p>${o.blurb}</p>
    <div class="frames">
      <div class="frame phone"><div class="cap">phone</div><div class="screen ${o.cls}">${o.render()}</div></div>
      <div class="frame wide"><div class="cap">desktop</div><div class="screen ${o.cls}">${o.render()}</div></div>
    </div>`;
  main.appendChild(s);
});
</script>
</body>
</html>
