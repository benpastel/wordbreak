<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>WordBreak</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&display=swap"
    />
    <script>
      // Preferences from src/client/Prefs.tsx, applied before first paint so a dark
      // theme never flashes light. Same key, same default.
      try {
        const theme = localStorage.getItem('wordbreak.theme');
        if (theme === 'dark') document.documentElement.dataset.theme = theme;
        const input = localStorage.getItem('wordbreak.input');
        if (input === 'tap') document.documentElement.dataset.input = input;
      } catch {}
    </script>
    <meta
      name="description"
      content="A multiplayer word game. Select adjacent letters to claim a word and lock them; only a strictly longer word can break the claim."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
